name: Benchmark refresh validation

# Only the explicitly owned branch in this public repository runs this job.
# No fork/PR code, deployment permission, artifact upload or hosted cache.
on:
  push:
    branches:
      - codex/benchmark-gallery-refresh-2026-10-12
      - codex/gemini-4-argon-tracker-2026-10-15
      - codex/benchmark-gallery-refresh-2026-10-19

permissions:
  contents: read

concurrency:
  group: benchmark-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gallery:
    if: >-
      github.repository == 'Pazneria/lab' &&
      (github.ref == 'refs/heads/codex/benchmark-gallery-refresh-2026-10-12' || github.ref == 'refs/heads/codex/gemini-4-argon-tracker-2026-10-15' || github.ref == 'refs/heads/codex/benchmark-gallery-refresh-2026-10-19') &&
      github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - name: Check out the exact trusted branch revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 20
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/benchmark-refresh-2026-10-12.yml
            /assets/
            /data/
            /scripts/
            /tests/
            /docs/
            /evidence/gallery-data-validation.json
            /evidence/frontend-packet-reconciliation.json
            /index.html
            /benchmarks.html
            /results.html
            /catalog.html
            /results-technical.html
            /README.md
            /.gitattributes
            /lab-space/index.html
            /walkable-3d/index.html
      - name: Set up Node for the isolated validator
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Set up Python for static references
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Record the exact revision and runner tool versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '## Benchmark refresh validation\n\nRevision: `%s`\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          node --version
          python --version
          git status --short
      - name: Install pinned ephemeral browser-test tools
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/lab-npm-cache
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/lab-tools" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org playwright@1.63.0 axe-core@4.13.0
          LAB_TOOLS_ROOT="$RUNNER_TEMP/lab-tools" node scripts/verify-benchmark-ci-toolchain.cjs
          node "$RUNNER_TEMP/lab-tools/node_modules/playwright/cli.js" install --with-deps chromium
          printf 'LAB_PLAYWRIGHT_MODULE=%s\n' "$RUNNER_TEMP/lab-tools/node_modules/playwright" >> "$GITHUB_ENV"
          printf 'LAB_AXE_SCRIPT=%s\n' "$RUNNER_TEMP/lab-tools/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"
      - name: Check committed data projections and static references
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-catalog.cjs --check
          node scripts/build-results.cjs --check
          node scripts/build-coverage.cjs --check
          node scripts/build-gallery-metadata.cjs --check
          node scripts/build-gallery-refresh-2026-10-12.cjs --check
          node scripts/build-gallery-gemini-argon-2026-10-15.cjs --check
          node scripts/build-gallery-refresh-2026-10-19.cjs --check
          node scripts/build-gallery.cjs --check --publish-check
          node tests/verify-benchmark-refresh.cjs
          node tests/verify-gemini-argon.cjs
          node tests/verify-benchmark-2026-10-19.cjs
          node scripts/verify-benchmark-refresh-boundary.cjs
          python tests/verify-static.py > "$RUNNER_TEMP/lab-static-check.log"
          tail -n 8 "$RUNNER_TEMP/lab-static-check.log"
      - name: Run bounded gallery regressions on the hosted runner
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          printf '\n### Independent browser checks\n\n| Script | Result |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          for script in \
            tests/verify-coverage.cjs \
            tests/verify-ranking-order.cjs \
            tests/verify-gallery-navigation.cjs \
            tests/verify-gallery-return.cjs \
            tests/verify-gallery-selection.cjs \
            tests/verify-real-catalog.cjs \
            tests/verify-ui.cjs \
            tests/verify-results.cjs
          do
            browser_channel="${LAB_BROWSER_CHANNEL:-}"
            # Installed full Chromium/new headless exercises the real BFCache path.
            if [ "$script" = tests/verify-gallery-return.cjs ]; then
              browser_channel=chromium
            fi
            if LAB_BROWSER_CHANNEL="$browser_channel" node "$script"; then
              printf '| `%s` | passed |\n' "$script" >> "$GITHUB_STEP_SUMMARY"
            else
              status=$?
              failures=$((failures + 1))
              printf '| `%s` | failed (exit %s) |\n' "$script" "$status" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "$failures" -ne 0 ]; then
            printf '%s independent browser check(s) failed\n' "$failures"
            exit 1
          fi
      - name: Record bounded evidence summaries without uploading storage
        if: always()
        shell: bash
        run: node scripts/summarize-benchmark-ci.cjs
