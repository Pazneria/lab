name: Minimal rig studio candidate
on:
  push:
    branches: [rebuild-minimal-rig-studio]
    paths:
      - animation-studio/minimal/**
      - animation-studio/rebuild.html
      - animation-studio/tests/minimal-studio.test.mjs
      - scripts/review-minimal-studio.mjs
      - .github/workflows/minimal-rig-studio.yml
permissions:
  contents: read
concurrency:
  group: minimal-studio-hosted-graphics
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen assets and worker/resource contracts
        run: node --experimental-vm-modules --test animation-studio/tests/minimal-studio.test.mjs tests/verify-public-rig-studio.test.mjs
      - name: Runner-only browser controller
        run: npm install --prefix "$RUNNER_TEMP/minimal-browser" --no-audit --no-fund playwright@1.64.0
      - name: Bounded hosted browser review
        env:
          STUDIO_PLAYWRIGHT: ${{ runner.temp }}/minimal-browser/node_modules/playwright/index.mjs
          STUDIO_REVIEW_SHA: ${{ github.sha }}
          STUDIO_REVIEW_PHASE: failure
        run: xvfb-run -a node scripts/review-minimal-studio.mjs
      - name: Review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-studio-${{ github.sha }}
          path: minimal-studio-evidence/
          retention-days: 7
